name: Deploy to Railway (backend repo)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy backend to Railway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -sSL https://raw.githubusercontent.com/railwayapp/cli/master/install.sh | sh
          railway --version || npm i -g @railway/cli

      - name: Login to Railway
        env:
          RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}
        run: |
          if [ -z "$RAILWAY_API_KEY" ]; then echo "RAILWAY_API_KEY not found - aborting"; exit 1; fi
          railway login --apiKey "$RAILWAY_API_KEY"

      - name: Deploy backend (railway up)
        env:
          RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}
        run: |
          # Deploy the backend service
          railway up --detach || (echo "railway up failed"; exit 1)

      - name: Notify success
        run: echo "Railway deployment triggered for backend repo (branch: $GITHUB_REF)"